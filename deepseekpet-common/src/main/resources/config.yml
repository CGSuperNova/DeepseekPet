# ============================================================
#  DeepseekPet 主配置
#  （free 与 premium 共用）
# ============================================================

pet:
  # 玩家进服后是否自动生成鲸鱼娘
  auto-spawn-on-join: true
  # 鲸鱼娘对应的 ItemsAdder 自定义实体 id（命名空间:实体名）
  entity-id: "whalechan:whalechan"
  # 头顶悬浮字格式（%player% 会被替换为玩家名）
  name-format: "玩家 %player% 的鲸鱼娘"
  # 是否显示原版名字标签（悬浮字）
  show-name-tag: true

ai:
  # 本地 RAG 检索服务地址（rag-bridge，参考 local_rag_qa 实现）
  rag-url: "http://127.0.0.1:8100"
  # 对应 rag-bridge/.env 里的 API_KEYS，留空表示不鉴权
  rag-api-key: ""
  # 单次请求超时（秒）
  timeout-seconds: 120
  # RAG 服务不可用时，是否直连 DeepSeek 兜底（保证能聊日常）
  fallback-to-llm: true
  # 直连大模型的配置（兜底对话 & premium 记忆摘要使用，OpenAI 兼容协议）
  llm:
    base-url: "https://api.deepseek.com"
    api-key: ""
    model: "deepseek-chat"
    temperature: 0.7
    max-tokens: 2048
  # 持久记忆：每个玩家保留的最近对话轮数（1 轮 = 一问一答）
  memory-max-turns: 20

ambient:
  # 是否启用定时 / 条件随机台词
  enabled: true
  # 台词以悬浮字显示在头顶的时长（秒）
  float-seconds: 4
  # 条件检查间隔（秒）
  check-interval-seconds: 30

follow:
  # 玩家生成鲸鱼娘时默认是否跟随
  default-enabled: true

fallback:
  # 当 ItemsAdder 未启用时的降级：
  #   1 级优先 Citizens（玩家模型 NPC），2 级最终为原版盔甲架
  armorstand:
    # 超出该距离（格）则传送跟随
    follow-distance: 10
    # 传送后与玩家的水平距离（格），并在附近找安全点避免卡墙
    tp-distance: 2
    # 头颅皮肤 base64（玩家头颅的 textures 属性值，留空则用默认 Steve 头颅）
    # 示例：eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmRjZDJiMjBiMWFhYzkwODBhOTBlZDEyNjliN2Q0ZTY3ODZkMzdmNjNiYmE5ZDNhNmMyN2RiYjY3ZTFkYzExNCJ9fX0=
    head-texture: ""

info:
  # 是否在对话时附带「主人当前信息」给 DeepSeek
  enabled: true
  # 金币（需 Vault）
  vault: true
  # 背包 + 末影箱
  inventory: true
  # 信息缓存时长（秒）：玩家连发时避免反复解析背包 / PAPI
  cache-seconds: 3
  # （premium 专有）自定义 PAPI 变量，逗号分隔，例如 %player_health%,%player_level%
  custom-placeholders: ""

attack:
  # 鲸鱼娘可被攻击，但不会掉血 / 死亡（无敌）
  enabled: true
  # 被玩家攻击时的反馈台词（随机抽一句，以悬浮字显示）
  lines:
    - "呜呜…为什么要打我"
    - "好痛！本鲸要生气了"
    - "别打啦，我很乖的"
  # 反馈冷却（秒），避免连击刷屏
  cooldown-seconds: 3

mood:
  # 初次登入的心情值（0-100）
  initial: 50
  # 饥饿值区间 -> 每 interval-seconds 秒增减 amount
  rules:
    - hunger-min: 0
      hunger-max: 5
      interval-seconds: 30
      amount: -1
    - hunger-min: 6
      hunger-max: 14
      interval-seconds: 60
      amount: 0
    - hunger-min: 15
      hunger-max: 20
      interval-seconds: 30
      amount: 1
  # 五种心情的对话风格（注入 AI system prompt）
  styles:
    DEVASTATED: "语气虚弱、沮丧，句子短，偶尔自责或沉默"
    UNHAPPY: "语气低落、爱答不理，偶尔抱怨"
    NEUTRAL: "平常心，温和自然"
    HAPPY: "轻快活泼，会主动撒娇"
    ECSTATIC: "非常兴奋，话多、语气夸张"

interactions:
  # 摸头 / 捏脸 / 抱抱 / 背起；mood-delta 影响心情，window-seconds 内最多 max-times 次
  pat:
    name: "摸头"
    enabled: true
    allowed-moods: ["NEUTRAL", "HAPPY", "ECSTATIC"]
    mood-delta: 3
    window-seconds: 60
    max-times: 5
    over-limit-event: ""
    animation: "pat"
  pinch:
    name: "捏脸"
    enabled: true
    allowed-moods: ["UNHAPPY", "NEUTRAL", "HAPPY"]
    mood-delta: 1
    window-seconds: 60
    max-times: 5
    over-limit-event: ""
    animation: "pinch"
  hug:
    name: "抱抱"
    enabled: true
    allowed-moods: ["NEUTRAL", "HAPPY", "ECSTATIC"]
    mood-delta: 5
    window-seconds: 120
    max-times: 3
    over-limit-event: ""
    animation: "hug"
  carry:
    name: "背起"
    enabled: true
    allowed-moods: ["NEUTRAL", "HAPPY", "ECSTATIC"]
    mood-delta: 4
    window-seconds: 120
    max-times: 3
    over-limit-event: ""
    animation: "carry"

messages:
  # 各种提示文本（可自行汉化）
  pet-spawned: "&b你的鲸鱼娘已经来到你身边啦～"
  pet-released: "&b鲸鱼娘被收起来啦（输入 /dp show 重新召唤）"
  pet-hidden: "&b鲸鱼娘已经隐藏啦（输入 /dp show 重新召唤）"
  already-has-pet: "&e你已经有一只鲸鱼娘啦～"
  no-pet: "&e你还没有鲸鱼娘，输入 /dp show 召唤一只吧"
  dialog-start: "&b现在可以和鲸鱼娘聊天啦，直接输入文字发送即可，输入 &f/dp end &b结束对话"
  dialog-end: "&b和鲸鱼娘的对话结束啦～"
  thinking: "&7鲸鱼娘正在思考中…"
  ai-error: "&c鲸鱼娘暂时开小差啦：%error%"
  rag-down: "&e本地知识库服务未启动，鲸鱼娘先用聊天模式陪你聊～"
  reloaded: "&aDeepseekPet 配置已重载"
