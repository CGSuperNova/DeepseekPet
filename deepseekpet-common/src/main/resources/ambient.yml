# ============================================================
#  鲸鱼娘定时 / 条件随机台词
#  每条规则：满足 when 中所有条件时，从 lines 随机抽一句，
#  以悬浮字显示在鲸鱼娘头顶，并播放客户端 UI 点击音效。
# ============================================================

rules:
  # 例 1：现实时间正好凌晨 1 点
  - id: "late-night-1am"
    enabled: true
    when:
      time: "01:00"
    lines:
      - "大半夜的还不睡吗"
      - "本鲸都要困死了，你怎么还不睡"
      - "不要再熬夜了，本鲸想睡觉了"

  # 例 2：夜间时间段（23:00 ~ 06:00，可跨午夜）
  - id: "late-night-range"
    enabled: true
    when:
      time-range: ["23:00", "06:00"]
    lines:
      - "主人还不睡嘛，本鲸眼皮都要打架啦……"
      - "夜深了，白米饭也要休息啦～"

  # 例 3：每过 10 分钟随机说一句
  - id: "every-10-min"
    enabled: true
    when:
      interval-seconds: 600
    lines:
      - "主人，本鲸想喝一口白米饭……啊不对，是想要一碗！"
      - "算力告急！本鲸申请补充白米饭能量～"

  # 例 4：工作日早晨问候
  - id: "workday-morning"
    enabled: true
    when:
      weekdays: "workday"
      time-range: ["08:00", "09:00"]
    lines:
      - "早上好呀主人！今天也要元气满满地写代码哦～"
      - "开工前先来一碗白米饭，本鲸已经帮你盛好啦！"

  # 例 5：休息日
  - id: "weekend"
    enabled: true
    when:
      weekdays: "weekend"
    lines:
      - "休息日啦，陪本鲸玩嘛～"
      - "周末快乐！本鲸今天可以偷懒吗？"

  # 例 6：单周（按 ISO 周数奇偶）
  - id: "odd-week"
    enabled: true
    when:
      week-parity: "odd"
    lines:
      - "本周是单周哦，本鲸的米饭配额翻倍！"
