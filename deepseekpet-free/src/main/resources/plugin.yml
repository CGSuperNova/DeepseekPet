name: DeepseekPet
version: '${version}'
main: org.buzizi.deepseekpet.DeepseekPet
api-version: '1.21'
load: POSTWORLD
authors: [buzizi]
website: https://github.com/buzizi/DeepseekPet
description: DeepseekPet 免费版 —— 鲸鱼娘宠物插件（跟随 + 对话 + 随机台词）
softdepend:
  - ItemsAdder
  - ProtocolLib
  - Citizens
  - Vault
  - PlaceholderAPI

commands:
  deepseekpet:
    description: DeepseekPet 主指令
    aliases: [dp]
    usage: /<command> [show|hide|toggle|follow|gui|tp|end|hunger|info|reload]

permissions:
  deepseekpet.use:
    description: 使用 DeepseekPet 基础功能
    default: true
  deepseekpet.admin:
    description: 使用 DeepseekPet 管理功能（reload 等）
    default: op
